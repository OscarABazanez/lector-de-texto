[package]
name = "lector"
version = "0.1.0"
description = "Lector de pantalla con fórmulas matemáticas"
edition = "2021"
default-run = "lector"

[lib]
name = "lector_lib"
path = "src/lib.rs"

[[bin]]
name = "lector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
keyring = "4.2"
# `wgc`: Windows Graphics Capture. Con GDI los videos acelerados por hardware salen negros.
xcap = { version = "0.9", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3"] }
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"] }
directories = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Media_Ocr",
  "Storage_Streams",
  "Graphics_Imaging",
  "Globalization",
  "Security_Cryptography",
  "Win32_System_Com",
] }

# Las dependencias (captura, JPEG, audio) se optimizan también en desarrollo: sin esto
# congelar la pantalla tarda casi un segundo en la compilación de pruebas.
[profile.dev.package."*"]
opt-level = 3

# El código genérico (JPEG, conversión de píxeles) se compila dentro de este crate.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
