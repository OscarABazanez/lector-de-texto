# Genera los instaladores de Windows (.exe) y macOS (.dmg universal) en GitHub.
# Se lanza a mano (Actions → Instaladores → Run workflow) o al subir una etiqueta v*.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Compilar
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: lector-${{ matrix.os }}
          path: ${{ matrix.files }}
